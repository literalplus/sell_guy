services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    init: true
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://sell_guy_dev:sell_guy_dev@postgres:5432/sell_guy
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      APP_BASE_URL: http://localhost:4200
      OIDC_REDIRECT_URI: http://localhost:4200/
      OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:4200/
      STATIC_DIR: apps/web/dist
    volumes:
      - ..:/workspaces/sell-guy
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sell_guy
      POSTGRES_USER: sell_guy_dev
      POSTGRES_PASSWORD: sell_guy_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sell-guy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sell_guy_dev -d sell_guy"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  sell-guy-postgres:
